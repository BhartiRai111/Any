name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://boutique:boutique@localhost:5432/boutique
      SESSION_SECRET: ci-only-secret-that-is-at-least-32-characters-long
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: boutique, POSTGRES_PASSWORD: boutique, POSTGRES_DB: boutique }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U boutique" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
